[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trazo"
version = "0.1.0"
description = "Toolkit for FTW-style field boundary and traceability workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "shapely",
    "pyproj",
    "numpy",
    "pyarrow",
]

[project.optional-dependencies]
pt1 = ["pystac-client>=0.8", "odc-stac>=0.3", "planetary-computer>=1.0", "python-dateutil", "rasterio", "rioxarray", "tqdm", "odc-stac>=0.3"]
pt2 = ["rasterio", "geopandas", "shapely", "pyproj", "rtree", "pyarrow", "zarr", "hickle", "tqdm"]
pt4 = [
    "torch>=2.0",
    "lightning>=2.0",
    "torchgeo>=0.5",
    "segmentation-models-pytorch",
    "ultralytics",
    "kornia",
    "einops",
    "torchmetrics",
    "click",
    "pyyaml",
    "matplotlib",
    "hickle",
    "rasterio>=1.3",
    "geopandas",
    "ftw-tools",
]
pt5 = ["ftw-tools"]  # whatever package provides `ftw`
# Active-learning sampling from a model checkpoint.
# Install with: pip install "trazo[active]"
active = [
    "ftw-tools",           # FTW model + trainer (CustomSemanticSegmentationTask)
    "torch>=2.0",          # deep learning runtime
    "rasterio>=1.3",       # raster I/O and reprojection
    "numpy>=1.24",
    "tqdm",
    "shapely",
]
all = ["trazo[pt1,pt2,pt4,pt5,active]"]

[project.scripts]
trazo-pt1-create = "trazo.pt1_createdata.cli:main"
trazo-pt2-dataprep = "trazo.pt2_dataprep.cli:main"
trazo-pt3-finetune    = "trazo.pt3_finetune.cli:main"
trazo-pt4-train       = "trazo.pt4_train.cli:model"
trazo-pt5-infer = "trazo.pt5_inference.cli:main"
trazo-active-sample = "trazo.pt1_createdata.active_sample:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
