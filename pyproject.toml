[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tkt"
version = "0.1.0"
description = "Toolkit for FTW-style field boundary and traceability workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "shapely",
    "pyproj",
    "numpy",
    "pyarrow",
]

[project.scripts]
tkt-pt1-create-grid = "tkt.pt1_createdata.gridding:main"
tkt-pt2-prep-data   = "tkt.pt2_dataprep.cli:main"
tkt-pt3-finetune    = "tkt.pt3_finetune.cli:main"
tkt-pt4-train       = "tkt.pt4_train.cli:main"
tkt-pt5-infer       = "tkt.pt5_inference.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
