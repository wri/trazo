<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <script>document.documentElement.setAttribute("data-theme","light");</script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Trazo Private Preview</title>
  <link rel="stylesheet" href="https://use.typekit.net/fxq7ozw.css"/>
  <style>
    /* ── RESET ───────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── BRAND TOKENS (mirrors index.html / landing.html) ─────────────────── */
    :root {
      --gold:    #F0AB00;
      --gold-lt: #ffd04d;
      --bg-page:     #050c03;
      --bg-panel:    #070f04;
      --bg-elevated: #0d160a;
      --text:       #E7E6E6;
      --text-muted: #9B9B9B;
      --text-dim:   #666666;
      --border:       rgba(240,171,0,0.30);
      --border-dim:   rgba(240,171,0,0.12);
      --border-faint: rgba(240,171,0,0.08);
      --surface:       rgba(255,255,255,0.035);
      --surface-hover: rgba(255,255,255,0.07);
      --font-header: 'acumin-pro', 'Acumin Pro', 'Arial Narrow', Arial, sans-serif;
      --font-body:   'adobe-caslon-pro', 'Adobe Caslon Pro', Georgia, 'Times New Roman', serif;
      --font-mono:   'Courier New', Courier, monospace;
    }
    /* ── LIGHT THEME TOKENS ──────────────────────────────────────────────── */
    :root[data-theme="light"] {
      --gold:    #8B6914;
      --gold-lt: #6b4e0a;
      --bg-page:     #f0ede6;
      --bg-panel:    #e9e4d8;
      --bg-elevated: #e9e4d8;
      --text:       #1e1c16;
      --text-muted: #5a5648;
      --text-dim:   #9a9488;
      --border:       rgba(80,70,40,0.22);
      --border-dim:   rgba(80,70,40,0.12);
      --border-faint: rgba(80,70,40,0.10);
      --surface:       rgba(80,70,40,0.05);
      --surface-hover: rgba(139,105,20,0.10);
    }

    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg-page);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      transition: background .2s, color .2s;
    }
    /* subtle vignette so the card floats */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(120% 90% at 50% 18%, transparent 40%, rgba(0,0,0,0.30) 100%);
    }
    [data-theme="light"] body::before {
      background: radial-gradient(120% 90% at 50% 18%, transparent 45%, rgba(80,70,40,0.10) 100%);
    }

    ::selection { background: var(--gold); color: var(--bg-page); }

    /* ── THEME TOGGLE ────────────────────────────────────────────────────── */
    #theme-toggle {
      position: fixed; top: 18px; right: 22px; z-index: 5;
      background: none; border: none; cursor: pointer;
      font-family: var(--font-mono); font-size: 9.5px;
      letter-spacing: .14em; text-transform: uppercase;
      color: var(--text-dim); padding: 4px 0;
      transition: color .15s;
    }
    #theme-toggle:hover { color: var(--gold); }

    /* ── CARD ────────────────────────────────────────────────────────────── */
    .card {
      position: relative; z-index: 1;
      max-width: 408px; width: 100%;
      background: var(--bg-panel);
      border: 1px solid var(--border-faint);
      box-shadow: 0 0 0 1px var(--border-faint), 0 24px 60px rgba(0,0,0,0.45);
      padding: 38px 34px 30px;
    }
    [data-theme="light"] .card { box-shadow: 0 0 0 1px var(--border-faint), 0 24px 60px rgba(0,0,0,0.14); }
    /* gold accent rule on top, like index model cards */
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: var(--gold);
    }

    /* mark */
    .mark {
      display: inline-flex; align-items: center; gap: 10px;
      font-family: var(--font-header); font-size: 17px; font-weight: 700;
      letter-spacing: .08em; text-transform: uppercase; color: var(--text);
      margin-bottom: 26px;
    }
    .mark .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

    .eyebrow {
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .22em;
      text-transform: uppercase; color: var(--gold);
      display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--gold); }

    h1 {
      font-family: var(--font-header); font-weight: 700;
      font-size: 38px; line-height: 1.04; letter-spacing: .01em;
      color: var(--text); margin-bottom: 12px;
    }
    .lede {
      font-family: var(--font-body); font-size: 15px; line-height: 1.6;
      color: var(--text-muted); max-width: 42ch; margin-bottom: 26px;
    }

    /* ── FORM ────────────────────────────────────────────────────────────── */
    form { display: block; }
    label {
      display: block; font-family: var(--font-header);
      font-size: 10px; font-weight: 700; letter-spacing: .16em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px;
    }
    input[type=password] {
      width: 100%; padding: 12px 13px;
      font-family: var(--font-body); font-size: 15px;
      color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: 0;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input[type=password]::placeholder { color: var(--text-dim); }
    input[type=password]:focus {
      outline: none; border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(240,171,0,0.18);
      background: var(--surface-hover);
    }
    [data-theme="light"] input[type=password]:focus { box-shadow: 0 0 0 2px rgba(139,105,20,0.18); }

    button#submit-btn {
      width: 100%; margin-top: 16px;
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 13px 18px;
      font-family: var(--font-header); font-size: 11.5px; font-weight: 700;
      letter-spacing: .12em; text-transform: uppercase;
      background: var(--gold); color: var(--bg-page);
      border: 1px solid var(--gold); cursor: pointer;
      transition: background .15s, color .15s;
    }
    button#submit-btn:hover:not(:disabled) { background: var(--gold-lt); border-color: var(--gold-lt); }
    button#submit-btn:disabled { opacity: 0.6; cursor: wait; }
    button#submit-btn .arr { font-family: var(--font-mono); font-weight: 400; }

    .err {
      margin-top: 14px; min-height: 1.2em;
      font-family: var(--font-mono); font-size: 12px; letter-spacing: .03em;
      color: #e0653e;
    }
    [data-theme="light"] .err { color: #b3401c; }

    /* ── FOOTER NOTE ─────────────────────────────────────────────────────── */
    .foot {
      margin-top: 26px; padding-top: 16px;
      border-top: 1px solid var(--border-faint);
      font-family: var(--font-body); font-size: 12.5px; line-height: 1.6;
      color: var(--text-muted);
    }
    .foot .lockline {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--text-dim); margin-top: 12px;
    }
    .foot .lockline::before {
      content: ""; width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle light or dark theme">Dark mode</button>

  <div class="card">
    <div class="mark"><span class="dot"></span>Trazo</div>
    <div class="eyebrow">Private preview</div>
    <h1><br/></h1>
    <p class="lede">Trazo is restricted. Enter the access password to continue.</p>

    <form id="pw-form">
      <label for="pw">Access password</label>
      <input type="password" id="pw" autocomplete="off" autofocus/>
      <button id="submit-btn" type="submit">Enter <span class="arr">&#8594;</span></button>
      <div class="err" id="err"></div>
    </form>

    <div class="foot">
      Decryption happens entirely in your browser. The password unlocks the page locally &mdash; nothing is sent to a server.
      <div class="lockline">Encrypted client&#8202;-&#8202;side &middot; AES&#8202;-&#8202;GCM</div>
    </div>
  </div>

  <script>
    /* theme toggle — mirrors the light/dark switch on the main site */
    (function () {
      var root = document.documentElement;
      var btn  = document.getElementById("theme-toggle");
      function sync() {
        var dark = root.getAttribute("data-theme") !== "light";
        btn.textContent = dark ? "Light mode" : "Dark mode";
      }
      btn.addEventListener("click", function () {
        root.setAttribute("data-theme",
          root.getAttribute("data-theme") === "light" ? "dark" : "light");
        sync();
      });
      sync();
    })();
  </script>

    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

    async function decrypt(password) {
      const enc = new TextEncoder();
      const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(password),
        { name: "PBKDF2" }, false, ["deriveKey"]
      );
      const aesKey = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: fromB64(META.salt),
          iterations: META.iterations,
          hash: "SHA-256",
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        false, ["decrypt"]
      );
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: fromB64(META.nonce) },
        aesKey,
        fromB64(META.ciphertext)
      );
      return new TextDecoder().decode(plaintext);
    }

    document.getElementById("pw-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw  = document.getElementById("pw").value;
      const err = document.getElementById("err");
      const btn = document.getElementById("submit-btn");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Decrypting\u2026";
      try {
        // decrypt() throws on a wrong password (AES-GCM auth-tag failure),
        // so reaching the next line means the password is correct.
        await decrypt(pw);
        window.location.href = "landing.html";
      } catch (e2) {
        err.textContent = "Wrong password.";
        btn.disabled = false;
        btn.textContent = "Enter";
        document.getElementById("pw").select();
      }
    });
  </script>
