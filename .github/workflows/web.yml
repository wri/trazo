# Build the site with Jekyll (same engine as classic Pages) and deploy to
# GitHub Pages. Reproduces the current site — README.md renders as the
# homepage and web/ (the map) keeps its URL — while _config.yml scopes the
# build to the web-facing content and landing/ adds the public landing page.
#
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Stage LFS assets into web/
        run: |
          mkdir -p web/assets
          cp assets/fieldscropped2.gif web/assets/
          cp assets/fieldsthumb.png    web/assets/
          cp assets/samvstkt.mp4       web/assets/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        # Defaults to uploading ./_site produced by the Jekyll build.

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
