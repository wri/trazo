# Python CI. The `core` job is the fast gate every push must pass; the `deep`
# job installs the training stack, which is the only way to catch import-level
# breakage in Steps 3 and 4 (a package rename once left Step 4 unimportable and
# nothing noticed, because the only workflow in this repo built the website).
name: Python CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + Step 2 extras
        run: |
          python -m pip install -U pip wheel setuptools
          pip install -e ".[pt1,pt2,dev]"

      - name: Tests (no deep-learning extras)
        run: pytest -m "not heavy" -v

      - name: Offline end-to-end smoke path
        run: trazo-smoke

  deep:
    name: training stack imports (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU torch first
        run: |
          python -m pip install -U pip wheel setuptools
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Steps 3-5 extras
        run: pip install -e ".[pt3,pt4,pt5,dev]"

      - name: Import every training and inference module
        run: pytest -m heavy -v
