# Step 4 - example training config (3-class: background / interior / boundary).
#
# This is the config the README's Step 4 quick start refers to. It reproduces the
# TrazoSA / Trazo2 / Trazo3 training setup from the technical note: boundary-
# weighted class weights, a 300-epoch budget with early stopping, and lr 0.003.
#
# Run:
#   trazo-pt4-train fit --config example_3class.yaml
#       --data-dir /data/region --output-dir /models/checkpoints
#
# --data-dir overrides data.init_args.root and --output-dir overrides
# trainer.default_root_dir, so the paths below are only defaults.
#
# The data layout expected under root is the Step 2 output:
#   <root>/<country>/s2_images/window_a/<chip>.tif
#   <root>/<country>/label_masks/semantic_3class/<chip>.tif
#   <root>/chips_<country>.parquet

seed_everything: 7

trainer:
  max_epochs: 300
  log_every_n_steps: 10
  accelerator: auto
  devices: auto
  gradient_clip_val: 0.5
  default_root_dir: logs/trazo_train
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:03d}-{val_loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 50
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: trazo.pt4_train.trainers.CustomSemanticSegmentationTask
  init_args:
    model: unet                 # see models.py for unet_r, upernet, deeplabv3+, fcn, fcsiam*
    backbone: efficientnet-b3
    weights: true               # ImageNet encoder weights
    in_channels: 8              # planting (4 bands) + harvest (4 bands)
    num_classes: 3
    num_filters: 64
    loss: tversky_ce            # see losses.py for the full list
    class_weights: [0.05, 0.20, 0.75]   # background / interior / boundary
    ignore_index: 3             # class 3 = unlabeled (presence-only masks)
    patch_weights: false
    lr: 0.003                   # the note raised this from 0.001 for TrazoSA onward
    patience: 50                # cosine annealing T_max

data:
  class_path: trazo.pt4_train.datamodules.FTWDataModule
  init_args:
    root: data/ftw
    batch_size: 32              # 32-64 is more stable with boundary-focused losses
    num_workers: 4
    temporal_options: stacked   # stacked | windowA | windowB | median | random_window
    train_countries: [region]
    val_countries: [region]
    test_countries: [region]
    preprocess_aug: true        # random divisor normalization, for radiometric robustness
    random_shuffle: false       # channel shuffle augmentation
  dict_kwargs:
    load_boundaries: true
