# Step 3.1 - decoder fine-tuning.
#
# The encoder is frozen; the decoder and segmentation head are updated (about
# 2.5M of 13M parameters). On 80 Mato Grosso chips it matched full fine-tuning
# on held-out chips (0.64 vs 0.66 field IoU, base 0.44) and did best on the
# Chiquitania test set, so it is the cheaper default when GPU memory is tight.
#
# Run:
#   trazo-pt3-finetune run --strategy decoder --config this_file.yaml
#       --checkpoint /models/ftw_3class.ckpt
#       --data-dir /data/region --output-dir /models/ft_decoder
#
# Every key below is overridable from the command line, e.g.
#   --data.init_args.batch_size=16

seed_everything: 7

trainer:
  max_epochs: 300           # note used 300 epochs with early stopping
  log_every_n_steps: 10
  accelerator: auto
  devices: auto
  gradient_clip_val: 0.5
  default_root_dir: logs/trazo_finetune_decoder
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        mode: min
        save_top_k: 1
        save_last: true
        filename: "best-{epoch:03d}-{val_loss:.4f}"
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        mode: min
        patience: 100        # note used patience 100 on a 300-epoch budget
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch

model:
  class_path: trazo.pt3_finetune.trainers.FineTuneTask
  init_args:
    strategy: decoder
    pretrained_ckpt: null    # set with --checkpoint
    model: unet
    backbone: efficientnet-b3   # best FTW benchmark backbone
    weights: true               # ImageNet init before the checkpoint loads
    in_channels: 8              # planting + harvest, 4 bands each
    num_classes: 3              # background / interior / boundary
    num_filters: 64
    loss: ce
    class_weights: [0.05, 0.20, 0.75]   # boundary-weighted, per the note
    ignore_index: 3             # class 3 = unlabeled, presence-only masks
    patch_weights: false
    lr: 1.0e-4
    patience: 100               # cosine annealing T_max

data:
  class_path: trazo.pt4_train.datamodules.FTWDataModule
  init_args:
    root: data/ftw              # override with --data-dir
    batch_size: 32
    num_workers: 4
    temporal_options: stacked
    train_countries: [region]
    val_countries: [region]
    test_countries: [region]
  dict_kwargs:
    load_boundaries: true
